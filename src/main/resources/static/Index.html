<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --border: #e2e8f0;
      --completed-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.6rem;
    }

    .subtitle {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .todo-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .todo-form input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
    }

    .todo-form input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--primary);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .filters {
      display: flex;
      gap: 0.4rem;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.7rem;
    }

    .filter-btn.active {
      background: #eff6ff;
      color: var(--primary);
    }

    .stats {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
    }

    .todo-item.completed {
      background: var(--completed-bg);
    }

    .todo-main {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex: 1;
      min-width: 0;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .todo-title {
      word-break: break-word;
      font-size: 0.98rem;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .edit-input {
      flex: 1;
      padding: 0.4rem 0.6rem;
      font-size: 0.95rem;
      border: 1px solid var(--primary);
      border-radius: 6px;
    }

    .todo-actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>
    <p class="subtitle">Create, view, edit, complete, and delete your tasks.</p>

    <!-- Create To-Do Form -->
    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="Add a new task..."
        aria-label="New to-do item"
        required
      />
      <button type="submit" class="btn-primary">Add Task</button>
    </form>

    <!-- Filter & Status Bar -->
    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter to-do items">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div id="stats" class="stats">0 remaining</div>
    </div>

    <!-- To-Do Items List -->
    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script>
  const API_URL = "/api/todos";

  let todos = [];
  let currentFilter = "all";
  let editingId = null;

  const form = document.getElementById("todo-form");
  const input = document.getElementById("todo-input");
  const listEl = document.getElementById("todo-list");
  const statsEl = document.getElementById("stats");
  const filterButtons = document.querySelectorAll(".filter-btn");

  // Read (GET /api/todos)
  async function loadTodos() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`Failed to load todos (${res.status})`);
      todos = await res.json();
      render();
    } catch (err) {
      console.error(err);
      listEl.innerHTML = `<li class="empty-state">Unable to load tasks from the server.</li>`;
    }
  }

  // Create (POST /api/todos)
  async function addTodo(title) {
    const trimmed = title.trim();
    if (!trimmed) return;

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: trimmed })
    });

    if (res.ok) {
      const created = await res.json();
      todos.unshift(created);
      render();
    }
  }

  // Mark Completed / Active (PUT /api/todos/{id})
  async function toggleTodo(id) {
    const current = todos.find(todo => todo.id === id);
    if (!current) return;

    const res = await fetch(`${API_URL}/${encodeURIComponent(id)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: current.title,
        completed: !current.completed
      })
    });

    if (res.ok) {
      const updated = await res.json();
      todos = todos.map(todo => (todo.id === id ? updated : todo));
      render();
    }
  }

  function startEdit(id) {
    editingId = id;
    render();
    const editInput = document.getElementById(`edit-input-${id}`);
    if (editInput) {
      editInput.focus();
      editInput.setSelectionRange(editInput.value.length, editInput.value.length);
    }
  }

  // Edit Title (PUT /api/todos/{id})
  async function saveEdit(id, newTitle) {
    const trimmed = newTitle.trim();
    const current = todos.find(todo => todo.id === id);

    if (trimmed && current) {
      const res = await fetch(`${API_URL}/${encodeURIComponent(id)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: trimmed,
          completed: current.completed
        })
      });

      if (res.ok) {
        const updated = await res.json();
        todos = todos.map(todo => (todo.id === id ? updated : todo));
      }
    }

    editingId = null;
    render();
  }

  // Delete (DELETE /api/todos/{id})
  async function deleteTodo(id) {
    const res = await fetch(`${API_URL}/${encodeURIComponent(id)}`, {
      method: "DELETE"
    });

    if (res.ok) {
      todos = todos.filter(todo => todo.id !== id);
      if (editingId === id) editingId = null;
      render();
    }
  }

  function getFilteredTodos() {
    if (currentFilter === "active") {
      return todos.filter(todo => !todo.completed);
    }
    if (currentFilter === "completed") {
      return todos.filter(todo => todo.completed);
    }
    return todos;
  }

  function render() {
    const visibleTodos = getFilteredTodos();
    const remainingCount = todos.filter(todo => !todo.completed).length;
    statsEl.textContent = `${remainingCount} ${remainingCount === 1 ? "item" : "items"} remaining`;

    if (visibleTodos.length === 0) {
      listEl.innerHTML = `<li class="empty-state">No to-do items to display.</li>`;
      return;
    }

    listEl.innerHTML = "";

    visibleTodos.forEach(todo => {
      const li = document.createElement("li");
      li.className = `todo-item ${todo.completed ? "completed" : ""}`;

      const mainDiv = document.createElement("div");
      mainDiv.className = "todo-main";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "todo-checkbox";
      checkbox.checked = todo.completed;
      checkbox.setAttribute("aria-label", `Mark "${todo.title}" as completed`);
      checkbox.addEventListener("change", () => toggleTodo(todo.id));

      mainDiv.appendChild(checkbox);

      if (editingId === todo.id) {
        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.id = `edit-input-${todo.id}`;
        editInput.className = "edit-input";
        editInput.value = todo.title;

        editInput.addEventListener("keydown", e => {
          if (e.key === "Enter") saveEdit(todo.id, editInput.value);
          if (e.key === "Escape") {
            editingId = null;
            render();
          }
        });

        mainDiv.appendChild(editInput);

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "todo-actions";

        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "btn-primary";
        saveBtn.textContent = "Save";
        saveBtn.addEventListener("click", () => saveEdit(todo.id, editInput.value));

        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "btn-secondary";
        cancelBtn.textContent = "Cancel";
        cancelBtn.addEventListener("click", () => {
          editingId = null;
          render();
        });

        actionsDiv.append(saveBtn, cancelBtn);
        li.append(mainDiv, actionsDiv);
      } else {
        const titleSpan = document.createElement("span");
        titleSpan.className = "todo-title";
        titleSpan.textContent = todo.title;
        mainDiv.appendChild(titleSpan);

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "todo-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "btn-secondary";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => startEdit(todo.id));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn-danger";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

        actionsDiv.append(editBtn, deleteBtn);
        li.append(mainDiv, actionsDiv);
      }

      listEl.appendChild(li);
    });
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    addTodo(input.value);
    input.value = "";
    input.focus();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      filterButtons.forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  // Initial load from backend instead of localStorage
  loadTodos();
  </script>
</body>
</html>
